[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bookstudio"
version = "0.3.0"
description = "A safe PDF-to-EPUB source gateway and provider-neutral EPUB translation workflow for AI"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Book-Studio-Personal-Use-1.0"
license-files = ["LICENSE"]
authors = [
  { name = "khoa 'jak' le" },
]
keywords = ["epub", "pdf", "translation", "localization", "ai", "publishing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.scripts]
bookstudio = "bookstudio.cli:main"

[project.urls]
Repository = "https://github.com/wblekhoa/book-studio-core"
Issues = "https://github.com/wblekhoa/book-studio-core/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookstudio = ["templates/*.md"]
