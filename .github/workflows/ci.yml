name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Audit public boundary before executing project code
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m bookstudio public-audit . --json
      - name: Install package from clean copy
        run: |
          cp -R . "$RUNNER_TEMP/bookstudio-install"
          python -m pip install "$RUNNER_TEMP/bookstudio-install"
      - name: CLI smoke test
        run: bookstudio doctor --json
      - name: Unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: >-
          python -m compileall -q
          "$RUNNER_TEMP/bookstudio-install/src"
          "$RUNNER_TEMP/bookstudio-install/tests"
      - name: Audit public boundary
        run: PYTHONDONTWRITEBYTECODE=1 bookstudio public-audit . --json
